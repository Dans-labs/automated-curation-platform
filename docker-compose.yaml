services:
  acp:
    build: 
      context: . 
      dockerfile: Dockerfile-dev 
    ports:
      - 10124:10124
    environment:
      DB_DIALECT: postgresql+psycopg2
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
    volumes:
      - ./:/home/dans/acp 
    tty: true
    command: "poetry run python -m src.main"